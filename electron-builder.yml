appId: com.seed.roberta
productName: Roberta
directories:
  output: dist_electron
files:
  - dist/**
  - server/**
  - electron/**
  - "!electron/*.test.js"
  - "!server/tests/**"
  - package.json
extraResources:
  - from: scripts
    to: scripts
win:
  icon: build/icon.ico
  target:
    - nsis
nsis:
  oneClick: true
  perMachine: false
  artifactName: Roberta-Setup-${version}.exe
